name: Build Shokok APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build Offline Web Bundle
        run: bun run build:android

      - name: Ensure Android Platform Exists
        run: |
          if [ ! -d "android" ]; then
            bunx cap add android
          fi

      - name: Generate Android Icons and Splash Screens
        run: bun run android:assets

      - name: Sync Capacitor Android
        run: bunx cap sync android

      - name: Verify Generated Launcher Assets
        run: |
          find android/app/src/main/res -name "ic_launcher*" | sort || true

      - name: Grant Gradle Permission
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Shokok.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shokok
          path: Shokok.apk
